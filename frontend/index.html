<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand">🛍️ ShopEasy</a>
      <div class="nav-links">
        <a href="index.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count" class="badge">0</span></a>
        <a href="orders.html">Orders</a>
        <a href="admin.html" id="admin-link" class="d-none">Admin</a>
        <span id="nav-user" class="nav-user"></span>
        <button id="logout-btn" class="btn btn-outline d-none">Logout</button>
        <a href="login.html" id="login-link" class="btn btn-outline">Login</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <h1>Welcome to ShopEasy</h1>
      <p>Discover amazing products at unbeatable prices.</p>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search products by name or category..." />
        <select id="category-select" class="category-select">
          <option value="">All Categories</option>
        </select>
        <button id="search-btn" class="btn btn-primary">Search</button>
      </div>
    </section>

    <section id="products-grid" class="products-grid">
      <p class="loading">Loading products...</p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 ShopEasy. All rights reserved.</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
